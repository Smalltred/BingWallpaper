# ============================================================================
#  BingWallpaper — nginx 伪静态规则
#
#  宝塔用法：网站 → 设置 → 伪静态 → 把本文件内容整段粘进去 → 保存
#  （Apache 环境不用管这里，public/.htaccess 会自动生效）
#
#  前提：宝塔里要把「运行目录」设为 /public（网站 → 设置 → 网站目录 → 运行目录）。
#  这是标准 PHP 结构的固定要求，见 DEPLOY.md 第 3 节。
#
#  为什么现在只有这么几条：public/ 就是 Web 根，构建产物（assets/、fonts/）
#  的 URL 路径与物理路径完全一致，nginx 用它**自带的**规则就能直接发这些文件。
#  所以既不需要 try_files 回退、也不需要任何拒绝规则。
# ============================================================================

# ---- 必需：前端路由与接口 ----
# /archive、/docs、/api/*、/sitemap.xml 这些不是真实文件，必须交给入口 index.php。
# 不配这条的话：/ 能打开，但 /archive 和所有接口都会 404。
location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# ---- 可选：把静态资源的缓存时间调长一点 ----
# 面板自带的规则会给 .js/.css 设 12 小时、图片类 30 天。
# 构建产物文件名带内容指纹（index-a1b2c3.js），内容变了文件名就变，
# 所以可以放心设一年。删掉下面两块站点照样正常，只是浏览器会多几次条件请求。
location ^~ /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# 自托管字体按字族命名（没有指纹），只给 30 天，否则换字体会被老缓存挡住
location ^~ /fonts/ {
    expires 30d;
}
